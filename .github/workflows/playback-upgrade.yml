name: Validate buffered playback upgrade
on:
  push:
    branches: [perf/buffered-playback-20261010]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/buffered-playback-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted integration patch on the test branch
        run: python3 apply-upgrade.py
      - name: Correct image fixture and guard scrubbing and replay cancellation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/map-browser.mjs');s=p.read_text()
          s=s.replace('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLbtAAAAABJRU5ErkJggg==','iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGOQSznxHwAEOAJKNKHrggAAAABJRU5ErkJggg==')
          s=s.replace('requests:window.fixtureRequests?.slice(0,20)','requests:window.fixtureRequests?.slice(-5).map(r=>({type:r.type,url:r.url.slice(0,120)}))')
          p.write_text(s)
          p=Path('maps.js');s=p.read_text()
          old="pauseAnimation();if(state.times.length)$('animation-status').textContent='Preview '+stamp(state.times[Number(e.target.value)])+' UTC · release to load';"
          new="const preview=Number(e.target.value);pauseAnimation();e.target.value=String(preview);if(state.times.length)$('animation-status').textContent='Preview '+stamp(state.times[preview])+' UTC · release to load';"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('map-playback.js');s=p.read_text()
          old='if(this.index()>=this.length()-1){if(!await this.show(0)||!active())return;}'
          new="if(this.index()>=this.length()-1){if(!await this.show(0)||!active()){if(active()){this.pause();this.onState('failed');}return;}}"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          with Path('tests/map-performance.test.mjs').open('a') as f:
           f.write("\ntest('failed restart at the final frame resets the play button',async()=>{\n const states=[];const clock=new ForecastPlayback({length:()=>3,index:()=>2,prepare:async()=>true,show:async()=>false,onState:s=>states.push(s)});\n await clock.start();assert.equal(clock.playing,false);assert.equal(states.at(-1),'failed');\n});\n")
          PY
      - name: Syntax and all regression tests
        run: |
          node --check maps.js
          node --test tests/*.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test real page and renderer at desktop and phone sizes
        run: node tests/map-browser.mjs
      - name: Commit only the validated integration to the test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm apply-upgrade.py engine-replacement.txt .github/workflows/playback-upgrade.yml
          git add maps.js maps.html maps.css README.md map-playback.js tests/map-integration.test.mjs tests/map-browser.mjs tests/map-performance.test.mjs
          git commit -m 'Integrate validated buffered playback and synchronized forecast frames'
          git push origin HEAD:perf/buffered-playback-20261010
