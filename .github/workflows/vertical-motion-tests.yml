name: Direct vertical-motion data tests
on:
  pull_request:
    paths: ['scripts/build_vertical_motion.py', 'tests/test_vertical_motion.py', 'scripts/ensemble-requirements.txt', '.github/workflows/vertical-motion-tests.yml']
  push:
    branches: [main]
    paths: ['scripts/build_vertical_motion.py', 'tests/test_vertical_motion.py', '.github/workflows/vertical-motion-tests.yml']
permissions:
  contents: read
jobs:
  python-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ensemble-requirements.txt
      - run: pip install -r scripts/ensemble-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_vertical*.py'
