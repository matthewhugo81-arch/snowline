name: Map playback browser tests
on:
  push:
    branches: [main]
    paths: ['maps.*', 'map-*.js', 'vendor/**', 'tests/map-browser.mjs', '.github/workflows/map-browser-tests.yml']
  pull_request:
    branches: [main]
    paths: ['maps.*', 'map-*.js', 'vendor/**', 'tests/map-browser.mjs', '.github/workflows/map-browser-tests.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check desktop and phone controls with delayed synthetic weather transport
        run: node tests/map-browser.mjs
