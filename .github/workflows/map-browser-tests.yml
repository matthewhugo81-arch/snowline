name: Map playback browser tests
on:
  workflow_call:
  push:
    branches: [main]
    paths: ['maps.*', 'ukv-*.js', 'map-*.js', 'map-*.css', 'vendor/**', 'tests/map-browser.mjs', 'tests/map-interactions-browser.mjs', 'tests/accumulation-history-browser.mjs', 'tests/accumulation-periods-browser.mjs', 'tests/chart-image-browser.mjs', 'tests/ukv-retention-browser.mjs', 'tests/run-selector-browser.mjs', '.github/workflows/map-browser-tests.yml']
  pull_request:
    branches: [main]
    paths: ['maps.*', 'ukv-*.js', 'map-*.js', 'map-*.css', 'vendor/**', 'tests/map-browser.mjs', 'tests/map-interactions-browser.mjs', 'tests/accumulation-history-browser.mjs', 'tests/accumulation-periods-browser.mjs', 'tests/chart-image-browser.mjs', 'tests/ukv-retention-browser.mjs', 'tests/run-selector-browser.mjs', '.github/workflows/map-browser-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
# Only supersede older runs of these tests on the same ref, never feed or publish jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    # Keep the complete browser suite; avoid a slow apt mirror consuming its
    # time budget before tests start. Match the preinstalled browsers to npm.
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble@sha256:d8e0bdf35da90942fc8f97a65fa7f1969200ccd916ec0fd78780d80d9b81e07b
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
      - name: Check accumulation windows and pinned previous-run panels
        run: node tests/accumulation-history-browser.mjs
      - name: Check startup recovery without graphics support
        run: node tests/map-startup-browser.mjs
      - name: Check shared chart storage across four windows and mobile limits
        run: node tests/shared-cache-browser.mjs
      - name: Verify active-window loading allocation
        run: node tests/cache-activity-browser.mjs
      - name: Check complete frame retention under slow browser storage
        run: node tests/cache-save-pressure-browser.mjs
      - name: Check saved layouts across four tabs, refresh, restart and mobile
        run: node tests/map-layouts-browser.mjs
      - name: Check fixed rainfall periods and North Atlantic framing
        run: node tests/accumulation-periods-browser.mjs
      - name: Check UKV completed fallback, rollover and exact-cycle loading
        run: node tests/run-selector-browser.mjs
      - name: Check three-model comparison, twelve-hour steps and sidebar collapse
        run: MAP_THREE_PANELS_ONLY=1 node tests/map-browser.mjs
      - name: Check pan reuse, 143-frame loading and independent model, run and rainfall panels
        run: node tests/map-interactions-browser.mjs
      - name: Check lazy ensemble probabilities and UK/Ireland temperature anomalies
        run: node tests/ensemble-products-browser.mjs
      - name: Check desktop and phone controls with delayed synthetic weather transport
        run: node tests/map-browser.mjs
      - name: Check chart styles and image exports
        run: node tests/chart-image-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-browser-review
          path: review-output/
          retention-days: 7
