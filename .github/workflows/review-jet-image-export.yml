name: Review jet scales and chart image export
on:
  push:
    branches: [review/jet-image-export-20261012]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package source for isolated review
        run: |
          mkdir -p review-output
          git archive --format=zip HEAD > review-output/source.zip
          git rev-parse HEAD HEAD^{tree} > review-output/refs.txt
      - name: Check existing regression suite
        run: node --test tests/*.test.mjs > review-output/node-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jet-image-export-review
          path: review-output/
          retention-days: 1
