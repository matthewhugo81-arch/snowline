name: Verify map menu changes
on:
  push:
    branches: [review/map-menus-20261012]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check native temperature extrema in individual spatial files
        run: |
          mkdir -p review-output
          node scripts/inspect_temperature_extrema.mjs
      - name: Package source snapshot for local regression checks
        run: git archive --format=zip HEAD -o review-output/source.zip
      - name: Run map and chart regression checks
        run: node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-menu-review
          path: review-output/
          retention-days: 1
