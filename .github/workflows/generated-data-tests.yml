name: Validate generated forecast data
on:
  pull_request:
    branches: [main]
    paths: ['scripts/*.py', 'tests/test_*.py', 'scripts/ensemble-requirements.txt', '.github/workflows/generated-data-tests.yml']
  push:
    branches: [main]
    paths: ['scripts/*.py', 'tests/test_*.py', 'scripts/ensemble-requirements.txt', '.github/workflows/generated-data-tests.yml']
permissions:
  contents: read
jobs:
  python-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ensemble-requirements.txt
      - run: pip install -r scripts/ensemble-requirements.txt
      - name: Test every converter family in its production process boundary
        run: |
          # Native GRIB, HDF5, NetCDF and OM runtimes are separate production
          # processes. Keep the same boundaries in CI; run every test family.
          for family in ensemble generated mogreps vertical publication; do
            python -X faulthandler -m unittest discover -s tests -p "test_${family}*.py"
          done
      - name: Verify installed UK and Ireland temperature references
        run: python -m unittest discover -s tests -p test_temperature_climatology.py
