name: Validate generated forecast data
on:
  pull_request:
    branches: [main]
    paths: ['scripts/*.py', 'tests/test_*.py', 'scripts/ensemble-requirements.txt', '.github/workflows/generated-data-tests.yml']
  push:
    branches: [main]
    paths: ['scripts/*.py', 'tests/test_*.py', 'scripts/ensemble-requirements.txt', '.github/workflows/generated-data-tests.yml']
permissions:
  contents: read
jobs:
  python-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ensemble-requirements.txt
      - run: pip install -r scripts/ensemble-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
