name: Map feed health
on:
  # Cloudflare dispatches this workflow every three minutes independently of
  # GitHub cron. This schedule is a second clock, not the primary guarantee.
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: snowline-map-feed-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Avoid checking data while the publisher is rebuilding it
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '[.workflow_runs[] | select(.name == "Publish Snowline and ensemble maps" and .status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '::notice::Publisher is still running; health will be checked after publication completes.'
          fi
      - name: Check all five generated feeds, later hours, archives and publication age
        id: ensembles
        if: steps.publisher.outputs.skip != 'true'
        continue-on-error: true
        run: python scripts/check_generated_freshness.py --output health-output/ensembles.json
      - name: Recover any generated model update without overlapping builds
        if: steps.publisher.outputs.skip != 'true' && steps.ensembles.outputs.refresh_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-maps.yml/runs?branch=main&per_page=10" > /tmp/publish-runs.json
          busy=$(python - <<'PY'
          import json,time
          from datetime import datetime
          runs=json.load(open('/tmp/publish-runs.json'))['workflow_runs']
          active=any(r['status']!='completed' for r in runs)
          recent=any(time.time()-datetime.fromisoformat(r['updated_at'].replace('Z','+00:00')).timestamp()<60 for r in runs)
          print('true' if active or recent else 'false')
          PY
          )
          if [ "$busy" = true ]; then
            echo 'Publisher active or completed in the last minute; the next external check will retry.'
          else
            gh workflow run publish-maps.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'Requested publication for a missing run/hour, archive repair or overdue source check.'
          fi
      - name: Check all offered models, including ensemble binary transport
        if: steps.publisher.outputs.skip != 'true'
        run: node scripts/check_map_feeds.mjs health-output/map-feeds.json
      - name: Report official-source failures or missing cycles
        if: always() && steps.publisher.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('health-output/ensembles.json')
          if not p.exists(): raise SystemExit('Ensemble source check did not produce a report')
          rows=json.loads(p.read_text())['models']
          from datetime import datetime, timedelta
          problems = []
          for model in rows:
              status = model.get('status')
              if model.get('archive_status') == 'check-failed':
                  problems.append(f"{model['model']}: archive verification failed ({model.get('archive_error', 'unknown error')})")
              elif model.get('archive_status') == 'repair-needed':
                  print(f"::notice::{model['model']}: three-run archive repair requested")
              if status == 'check-failed':
                  problems.append(f"{model['model']}: official-source health check failed ({model.get('error', 'unknown error')})")
              elif status == 'newer-source-run':
                  # Allow the new source cycle to arrive progressively. A real
                  # outage is measured against the *published* cycle, rather
                  # than the age of the latest official cycle (which resets).
                  reference = datetime.fromisoformat(model['source_reference'].replace('Z', '+00:00'))
                  published = model.get('published_reference')
                  tolerance_hours = {'snowline_gefs_ensemble':12,'snowline_ecmwf_ensemble':24,'snowline_mogreps_uk':6,'snowline_mogreps_global':12,'snowline_gem_700':24,'snowline_icon_eu_700':6}[model['model']]
                  if not published:
                      problems.append(f"{model['model']}: no ensemble cycle is published")
                  else:
                      deployed = datetime.fromisoformat(published.replace('Z', '+00:00'))
                      if reference - deployed >= timedelta(hours=tolerance_hours):
                          problems.append(f"{model['model']}: published cycle trails official source by at least {tolerance_hours} h")
                      else:
                          print(f"::notice::{model['model']}: latest source cycle is still being published")
              elif status == 'hours-pending':
                  print(f"::notice::{model['model']}: same run as source; later forecast hours still being published")
          if problems:
              raise SystemExit('; '.join(problems))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.publisher.outputs.skip != 'true'
        with:
          name: map-feed-health
          path: health-output/
          retention-days: 7
