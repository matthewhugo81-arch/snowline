name: Publish Snowline and ensemble maps
on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: snowline-pages
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      validate: ${{ steps.revision.outputs.validate }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the exact deployed application revision
        id: revision
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          deployed=$(curl --fail --silent --show-error --retry 2 --max-time 20 "https://matthewhugo81-arch.github.io/snowline/site-revision.txt?check=$GITHUB_RUN_ID" || true)
          validate=true
          if [ "$deployed" = "$SOURCE_REVISION" ]; then
            validate=false
          elif [[ "$deployed" =~ ^[a-f0-9]{40}$ ]] && git fetch --depth=1 origin "$deployed"; then
            # Pipeline-only edits inherit the deployed runtime's browser proof.
            # Any changed file delivered to browsers still requires the suite.
            if git diff --quiet "$deployed" "$SOURCE_REVISION" -- . ':(exclude).github/**' ':(exclude)scripts/**' ':(exclude)tests/**' ':(exclude)review/**'; then validate=false; fi
          fi
          echo "validate=$validate" >> "$GITHUB_OUTPUT"
  browser:
    needs: release
    if: needs.release.outputs.validate == 'true'
    uses: ./.github/workflows/map-browser-tests.yml
  build:
    needs: [release, browser]
    if: always() && needs.release.result == 'success' && (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    outputs:
      changed: ${{ steps.publication.outputs.changed }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ensemble-requirements.txt
      - name: Install ensemble conversion tools
        run: pip install -r scripts/ensemble-requirements.txt
      - name: Verify forecast handling and units
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_ensemble*.py'
          python -m unittest discover -s tests -p 'test_generated*.py'
          python -m unittest discover -s tests -p 'test_mogreps*.py'
          python -m unittest discover -s tests -p 'test_vertical*.py'
          python -m unittest discover -s tests -p 'test_harmonie*.py'
          python -m unittest discover -s tests -p 'test_publication*.py'
      - uses: actions/cache@v4
        with:
          path: point-data
          key: point-forecasts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: point-forecasts-v1-
      - name: Refresh shared location forecasts at most once per hour
        run: node scripts/build_point_forecasts.mjs
      - uses: actions/cache@v4
        with:
          path: ensemble-data
          key: ensemble-grids-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ensemble-grids-v1-
      - uses: actions/cache@v4
        with:
          path: climatology-cache
          key: noaa-500hpa-daily-1991-2020-v1
      - name: Prepare the shared MOGREPS, EC ENS and GEFS anomaly baseline
        continue-on-error: true
        run: python scripts/mogreps_climatology_cache.py
      - name: Prepare ensemble and MOGREPS snowfall feeds concurrently
        shell: bash
        run: |
          python scripts/build_ensembles.py --model gefs --workers 4 --max-new-frames 128 &
          gefs=$!
          python scripts/build_ensembles.py --model ecmwf --workers 4 --max-new-frames 128 &
          ecmwf=$!
          python scripts/build_mogreps_snow.py --model uk --workers 2 &
          mogreps_uk=$!
          python scripts/build_vertical_motion.py --model gem --workers 3 &
          vertical_gem=$!
          python scripts/build_vertical_motion.py --model icon-eu --workers 3 &
          vertical_icon=$!
          failed=0
          wait "$gefs" || failed=1
          wait "$ecmwf" || failed=1
          wait "$mogreps_uk" || failed=1
          wait "$vertical_gem" || failed=1
          wait "$vertical_icon" || failed=1
          exit "$failed"
      - name: Prepare optional ensemble fields within a two-minute budget
        shell: bash
        run: |
          # Preserve completed core maps when the optional upstream is throttled.
          # Per-frame writes are atomic and cached, so later builds resume work.
          timeout --kill-after=15s 120s python scripts/build_ensemble_extras.py --model gefs --workers 4 &
          extra_gefs=$!
          timeout --kill-after=15s 120s python scripts/build_ensemble_extras.py --model ecmwf --workers 4 &
          extra_ecmwf=$!
          wait "$extra_gefs" || echo '::warning::Optional GEFS fields deferred; retaining last verified publication.'
          wait "$extra_ecmwf" || echo '::warning::Optional ECMWF fields deferred; retaining last verified publication.'
      - name: Restore matching native HARMONIE sea-level pressure
        continue-on-error: true
        run: timeout --kill-after=15s 180s python scripts/build_harmonie_pressure.py
      - name: Record source-to-publication health without changing model timestamps
        continue-on-error: true
        run: python scripts/check_generated_freshness.py --local-root ensemble-data --output ensemble-data/health.json
      - name: Assemble site without source-control or test files
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/review _site/climatology
          cp -a point-data _site/point-data
          mkdir -p _site/ensemble-data
          cp -a ensemble-data/snowline_gefs_ensemble ensemble-data/snowline_ecmwf_ensemble ensemble-data/snowline_mogreps_uk ensemble-data/snowline_gem_700 ensemble-data/snowline_icon_eu_700 _site/ensemble-data/
          for extra in snowline_gefs_extra_v2 snowline_ecmwf_extra_v2 knmi_harmonie_arome_europe; do
            if [ -f "ensemble-data/$extra/latest.json" ]; then
              cp -a "ensemble-data/$extra" _site/ensemble-data/
            fi
          done
          # Retain the last local MOGREPS publication as a same-run fallback
          # while companion publication is starting or temporarily unavailable.
          if [ -f ensemble-data/snowline_mogreps_global/latest.json ]; then
            cp -a ensemble-data/snowline_mogreps_global _site/ensemble-data/
          fi
          if [ -f ensemble-data/health.json ]; then cp ensemble-data/health.json _site/ensemble-data/; fi
          python -c "from pathlib import Path; [p.rename(p.with_suffix('.om.png')) for p in Path('_site/ensemble-data').rglob('*.om')]"
          git rev-parse HEAD > _site/site-revision.txt
          touch _site/.nojekyll
      - name: Publish verified historical IFS grids outside the Pages size budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          python scripts/publish_map_archive.py _site
      - name: Exclude unfinished optional payloads without changing the conversion cache
        run: python scripts/prepare_optional_publication.py _site
      - name: Measure unpacked size and skip unchanged publication
        id: publication
        run: python scripts/publication_manifest.py _site --live-url https://matthewhugo81-arch.github.io/snowline/publication.json
      - uses: actions/configure-pages@v5
        if: steps.publication.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.publication.outputs.changed == 'true'
        with:
          path: _site
  deploy:
    needs: build
    # A deliberately skipped browser job must not suppress changed data.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish complete site atomically
        id: deployment
        uses: actions/deploy-pages@v4
