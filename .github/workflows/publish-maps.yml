name: Publish Snowline and ensemble maps
on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: snowline-pages
  cancel-in-progress: false
jobs:
  release-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      browser_validated: ${{ steps.validation.outputs.browser_validated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check whether this exact source revision passed published browser gates
        id: validation
        run: python scripts/pages_release.py validation --revision "$GITHUB_SHA"
  map-browser:
    needs: release-plan
    if: needs.release-plan.outputs.browser_validated != 'true'
    uses: ./.github/workflows/map-browser-tests.yml
    with:
      revision: ${{ github.sha }}
  location-browser:
    needs: release-plan
    if: needs.release-plan.outputs.browser_validated != 'true'
    uses: ./.github/workflows/location-browser-tests.yml
    with:
      revision: ${{ github.sha }}
  build:
    needs: release-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ensemble-requirements.txt
      - name: Install ensemble conversion tools
        run: pip install -r scripts/ensemble-requirements.txt
      - name: Verify forecast handling and units
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_ensemble*.py'
          python -m unittest discover -s tests -p 'test_generated*.py'
          python -m unittest discover -s tests -p 'test_mogreps*.py'
          python -m unittest discover -s tests -p 'test_vertical*.py'
          python -m unittest discover -s tests -p 'test_pages*.py'
      - uses: actions/cache@v4
        with:
          path: point-data
          key: point-forecasts-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: point-forecasts-v1-
      - name: Refresh shared location forecasts at most once per hour
        run: node scripts/build_point_forecasts.mjs
      - uses: actions/cache@v4
        with:
          path: ensemble-data
          key: ensemble-grids-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ensemble-grids-v1-
      - name: Prepare ensemble and MOGREPS snowfall feeds concurrently
        shell: bash
        run: |
          python scripts/build_ensembles.py --model gefs --workers 4 --max-new-frames 128 &
          gefs=$!
          python scripts/build_ensembles.py --model ecmwf --workers 4 --max-new-frames 128 &
          ecmwf=$!
          python scripts/build_mogreps_snow.py --model uk --workers 2 &
          mogreps_uk=$!
          python scripts/build_vertical_motion.py --model gem --workers 3 &
          vertical_gem=$!
          python scripts/build_vertical_motion.py --model icon-eu --workers 3 &
          vertical_icon=$!
          failed=0
          wait "$gefs" || failed=1
          wait "$ecmwf" || failed=1
          wait "$mogreps_uk" || failed=1
          wait "$vertical_gem" || failed=1
          wait "$vertical_icon" || failed=1
          exit "$failed"
      - name: Prepare optional ensemble fields within a five-minute budget
        shell: bash
        run: |
          # Preserve completed core maps when the optional upstream is throttled.
          # Per-frame writes are atomic and cached, so later builds resume work.
          timeout --kill-after=15s 300s python scripts/build_ensemble_extras.py --model gefs --workers 4 &
          extra_gefs=$!
          timeout --kill-after=15s 300s python scripts/build_ensemble_extras.py --model ecmwf --workers 4 &
          extra_ecmwf=$!
          wait "$extra_gefs" || echo '::warning::Optional GEFS fields deferred; retaining last verified publication.'
          wait "$extra_ecmwf" || echo '::warning::Optional ECMWF fields deferred; retaining last verified publication.'
      - name: Record source-to-publication health without changing model timestamps
        continue-on-error: true
        run: python scripts/check_generated_freshness.py --local-root ensemble-data --output ensemble-data/health.json
      - name: Assemble runtime files and every advertised forecast run
        run: python scripts/assemble_pages.py
      - name: Measure unpacked Pages size and compare published content
        id: release
        run: python scripts/pages_release.py prepare --revision "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.changed == 'true'
        with:
          path: _site
  deploy:
    needs: [release-plan, build, map-browser, location-browser]
    # Skipped browser jobs are allowed only when the *published* site records
    # successful browser validation of this exact source revision. A failed or
    # cancelled check cannot publish, even when the data build has succeeded.
    if: >-
      ${{ always() && !cancelled() && needs.build.result == 'success' &&
          needs.build.outputs.changed == 'true' &&
          (needs.release-plan.outputs.browser_validated == 'true' ||
           (needs.map-browser.result == 'success' && needs.location-browser.result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish complete site atomically
        id: deployment
        uses: actions/deploy-pages@v4
