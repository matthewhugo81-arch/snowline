name: Final accumulation layout review
on:
  push:
    branches: [review/accumulations-history-20261012]
    paths: ['.github/workflows/review-accumulations.yml', 'map-previous-runs.css', 'docs/accumulations-history-20261012.md']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression suite on final source
        run: |
          mkdir -p review-output
          node --test tests/*.test.mjs | tee review-output/unit-tests.txt
      - name: Check UKV published frontier and exact candidate cycles
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const base='https://openmeteo.s3.amazonaws.com/data_spatial/ukmo_uk_deterministic_2km/',out=[];
          for(const path of ['latest.json','in-progress.json','2026/10/12/1500Z/meta.json','2026/10/12/1800Z/meta.json']){
            const r=await fetch(base+path,{cache:'no-store',signal:AbortSignal.timeout(15000)});
            let data;try{data=await r.json();}catch{}
            out.push({url:base+path,status:r.status,reference_time:data?.reference_time,completed:data?.completed,first:data?.valid_times?.[0],last:data?.valid_times?.at(-1)});
          }
          await writeFile('review-output/ukv-frontier-check.json',JSON.stringify({checkedAt:new Date().toISOString(),results:out},null,2));console.log(out);
          JS
      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check final desktop and mobile history layout and controls
        run: node tests/accumulation-history-browser.mjs 2>&1 | tee review-output/history-browser.txt
      - name: Record verified source identities
        run: |
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree} > review-output/tested-refs.txt
          git ls-tree -r HEAD > review-output/tested-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accumulation-final-review
          path: review-output/
          retention-days: 7
