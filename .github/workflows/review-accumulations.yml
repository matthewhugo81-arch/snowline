name: Review accumulations and previous runs
on:
  push:
    branches: [review/accumulations-history-20261012]
    paths: ['.github/workflows/review-accumulations.yml', 'review/**', 'map-accumulation*.js', 'map-previous*', 'tests/accumulation*', 'tests/previous*', 'scripts/verify_accumulation_live.mjs']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed application changes
        run: |
          python review/apply.py
          python review/fixes.py
          git diff --check
          mkdir -p review-output
          git diff > review-output/application.patch
      - name: Full numerical, timing and regression tests
        run: node --test tests/*.test.mjs | tee review-output/unit-tests.txt
      - name: Verify numerical totals against actual UKV source grids
        run: node scripts/verify_accumulation_live.mjs 2>&1 | tee review-output/live-numeric.txt
      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check accumulation panels and pinned three-run comparison
        run: node tests/accumulation-history-browser.mjs 2>&1 | tee review-output/history-browser.txt
      - name: Verify real UKV raster generation and record timings
        run: node tests/accumulation-live-browser.mjs 2>&1 | tee review-output/live-browser.txt
      - name: Check existing playback, maps and briefing behavior
        run: node tests/map-browser.mjs 2>&1 | tee review-output/existing-browser.txt
      - name: Check right-click exports and existing chart styles
        run: node tests/chart-image-browser.mjs 2>&1 | tee review-output/export-browser.txt
      - name: Check published feeds and timing without generating imagery
        continue-on-error: true
        run: node scripts/check_map_feeds.mjs review-output/map-feeds.json
      - name: Commit tested changes to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add map-*.js maps.js maps.html tests/map-briefing.test.mjs tests/map-browser.mjs tests/accumulation-history-browser.mjs
          git commit -m 'Apply verified accumulation and previous-run integration'
          git push origin HEAD:review/accumulations-history-20261012
          git rev-parse HEAD HEAD^{tree} > review-output/tested-refs.txt
          git ls-tree -r HEAD > review-output/tested-blobs.txt
          git archive --format=zip HEAD > review-output/tested-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accumulation-history-review
          path: review-output/
          retention-days: 7
