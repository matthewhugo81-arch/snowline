name: Profile long IFS accumulations
on:
  push:
    branches: [review/accumulation-speed-20261012]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p review-output
      - name: Current 72-hour IFS numeric path
        run: node scripts/profile_accumulation_speed.mjs baseline | tee review-output/baseline.txt
      - name: Bounded native block prefetch comparison
        run: node scripts/profile_accumulation_speed.mjs prefetch | tee review-output/prefetch.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accumulation-speed-profile
          path: review-output/
          retention-days: 7
